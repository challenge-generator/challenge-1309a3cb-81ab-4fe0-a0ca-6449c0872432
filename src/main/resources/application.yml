spring:
  r2dbc:
    url: r2dbc:postgresql://localhost:5432/payments_db
    username: payments_user
    password: payments_password
    pool:
      enabled: true
      initial-size: 10
      max-size: 30
      max-idle-time: 30m

  webflux:
    base-path: /api/payments

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus,circuitbreakers
  endpoint:
    health:
      show-details: always
    metrics:
      enabled: true

resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 1000
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        recordExceptions:
          - org.springframework.web.reactive.function.client.WebClientResponseException
          - java.util.concurrent.TimeoutException
          - java.io.IOException
    instances:
      antifraudService:
        baseConfig: default
      riskBureau:
        baseConfig: default
      paymentGateway:
        baseConfig: default

  retry:
    configs:
      default:
        maxAttempts: 3
        waitDuration: 500
        retryExceptions:
          - org.springframework.web.reactive.function.client.WebClientResponseException
          - java.util.concurrent.TimeoutException
          - java.io.IOException
    instances:
      antifraudService:
        baseConfig: default
      riskBureau:
        baseConfig: default
      paymentGateway:
        baseConfig: default"